name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run self-check
      - run: npm run typecheck
      - run: npm run lint
      # Chrome's legacy-scan, ratcheted against legacy-scan-baseline.json (no findings
      # today). A step in this job and not a job of its own: GitHub bills per job,
      # rounded up to the whole minute.
      - run: npm run lint:legacy
      - run: npm run build
        env:
          EXTERNA_API_URL: http://example.test
          # Empty = auto-discover; build still succeeds (setup UI on fetch fail).
          EXTERNA_COLLECTION:
