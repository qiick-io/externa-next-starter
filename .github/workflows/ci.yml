name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run self-check
      - run: npm run lint
      - run: npm run build
        env:
          EXTERNA_API_URL: http://example.test
          EXTERNA_COLLECTION: posts
